name: Backfill Real History (Twelve Data)

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Backfill history from Twelve Data
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: python scripts/backfill_history.py

      - name: Regenerate dashboard with real history
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python scripts/generate_dashboard.py

      - name: Commit updated history + dashboard
        run: |
          git config user.name "pm-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html data/history.json
          git diff --quiet --cached || git commit -m "Backfill real historical data via Twelve Data"
          git push
