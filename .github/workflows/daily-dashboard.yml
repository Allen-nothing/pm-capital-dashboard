name: Daily PM Capital Allocation Dashboard

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate dashboard
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python scripts/generate_dashboard.py

      - name: Commit updated dashboard + history
        run: |
          git config user.name "pm-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html data/history.json
          git diff --quiet --cached || git commit -m "Daily dashboard update: $(date -u +%Y-%m-%d)"
          git push
