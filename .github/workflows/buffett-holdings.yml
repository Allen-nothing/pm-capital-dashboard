name: Fetch Buffett Holdings (SEC 13F)

on:
  schedule:
    - cron: "0 1 * * 1"   # every Monday 01:00 UTC = 09:00 HKT - 13F only updates quarterly, weekly check is plenty
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch latest Berkshire Hathaway 13F from SEC EDGAR
        run: python scripts/fetch_buffett_holdings.py

      - name: Regenerate dashboard
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python scripts/generate_dashboard.py

      - name: Commit updated holdings + dashboard
        run: |
          git config user.name "pm-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/buffett_holdings.json index.html
          git diff --quiet --cached || git commit -m "Update Buffett/Berkshire 13F holdings: $(date -u +%Y-%m-%d)"
          git push
